<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/login.js" defer></script>
</head>

<body class="app-body">
  <main class="mobile-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Bienvenido</p>
          <h1>Iniciar sesión</h1>
        </div>
        <div class="app-logo">⚽</div>
      </div>
      <p class="hero-text">Ingresa para administrar o jugar tus quinielas.</p>
    </section>

    <section class="app-panel">
      <input id="emailInput" type="email" placeholder="Correo">
      <input id="passwordInput" type="password" placeholder="Contraseña">

      <button id="loginButton">Entrar</button>

      <div class="divider"></div>

      <div
        id="g_id_onload"        
        data-client_id="331887333817-0g0ni6nthbc530aaf9q7dctqhi1uknrp.apps.googleusercontent.com"                        
        data-callback="handleGoogleCredential"
        data-auto_prompt="false">
      </div>

      <div
        class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-theme="outline"
        data-text="signin_with"
        data-shape="pill"
        data-logo_alignment="left">
      </div>



      <button onclick="window.location.href='/register.html'" class="ghost-button">Crear cuenta</button>

      <p id="mensaje"></p>
    </section>
  </main>
</body>
</html>
