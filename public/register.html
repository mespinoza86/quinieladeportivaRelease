<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrarse</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/register.js" defer></script>
</head>

<body class="app-body">
  <main class="mobile-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <p class="eyebrow">Nueva cuenta</p>
          <h1>Registrarse</h1>
        </div>
        <div class="app-logo">📝</div>
      </div>
    </section>

    <section class="app-panel">
      <input id="nombreInput" placeholder="Nombre">
      <input id="emailInput" type="email" placeholder="Correo">
      <input id="passwordInput" type="password" placeholder="Contraseña">

      <button id="registerButton">Registrarme</button>
      <button onclick="window.location.href='/login.html'" class="ghost-button">Ya tengo cuenta</button>

      <p id="mensaje"></p>
    </section>
  </main>
</body>
</html>
